version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruiter_user
      POSTGRES_PASSWORD: recruiter_pass
      POSTGRES_DB: recruiter_db
    ports:
      - "5432:5432"
    volumes:
      - recruiter_pg_data:/var/lib/postgresql/data

volumes:
  recruiter_pg_data:
